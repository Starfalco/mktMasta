services:
  api:
    image: ${ECR_REGISTRY}/mktmasta-fastapi:latest
    working_dir: /code
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@${RDS_ENDPOINT}:5432/${DB_NAME}
    restart: unless-stopped

  ui:
    image: ${ECR_REGISTRY}/mktmasta-angular:latest
    ports:
      - "80:80"
    restart: unless-stopped

  airflow:
    image: ${ECR_REGISTRY}/mktmasta-airflow:latest
    environment:
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@${RDS_ENDPOINT}:5432/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL=10
      - AIRFLOW_UID=50000
      - AIRFLOW_GID=50000
    # No ports exposed — access via SSH tunnel:
    #   ssh -L 8080:localhost:8080 ubuntu@<EC2_IP>
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    restart: unless-stopped
