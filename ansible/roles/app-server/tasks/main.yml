---
# App server configuration

- name: Mount data disk (PostgreSQL, Redis, Airflow metadata)
  mount:
    name: "{{ item.path }}"
    src: "/dev/sdb1"
    fstype: ext4
    state: mounted
  loop:
    - { path: "/data/postgresql", owner: "postgres", group: "postgres", mode: "0700" }
    - { path: "/data/redis", owner: "redis", group: "redis", mode: "0755" }
    - { path: "/data/airflow-postgres", owner: "postgres", group: "postgres", mode: "0700" }
    - { path: "/data/airflow-logs", owner: "airflow", group: "airflow", mode: "0755" }
    - { path: "/data/extracts", owner: "airflow", group: "airflow", mode: "0755" }
    - { path: "/data/metadata", owner: "airflow", group: "airflow", mode: "0755" }
  ignore_errors: true

- name: Format data disk if not formatted
  filesystem:
    fstype: ext4
    dev: "/dev/sdb1"
  ignore_errors: true
  when: not ansible_mounts | selectattr('mount', 'equalto', '/data') | list | length

- name: Create data directories
  file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { path: "/data/postgresql", owner: "postgres", group: "postgres", mode: "0700" }
    - { path: "/data/redis", owner: "redis", group: "redis", mode: "0755" }
    - { path: "/data/airflow-postgres", owner: "postgres", group: "postgres", mode: "0700" }
    - { path: "/data/airflow-logs", owner: "airflow", group: "airflow", mode: "0755" }
    - { path: "/data/extracts", owner: "airflow", group: "airflow", mode: "0755" }
    - { path: "/data/metadata", owner: "airflow", group: "airflow", mode: "0755" }

- name: Mount data disk
  mount:
    name: "{{ item.path }}"
    src: "/dev/sdb1"
    fstype: ext4
    state: mounted
  loop:
    - { path: "/data/postgresql" }
    - { path: "/data/redis" }
    - { path: "/data/airflow-postgres" }
    - { path: "/data/airflow-logs" }
    - { path: "/data/extracts" }
    - { path: "/data/metadata" }
  when: not ansible_mounts | selectattr('mount', 'equalto', item.path) | list | length

- name: Clone mktMasta repository
  git:
    repo: "https://github.com/Starfalco/mktMasta.git"
    dest: "/opt/mktMasta"
    version: master
  become: true
  become_user: ubuntu

- name: Build Docker images (airflow, fastapi, angular)
  shell: |
    cd /opt/mktMasta
    docker build . -f airflow.dockerfile --tag extending_airflow:latest
    docker build . -f fastapi.dockerfile --tag mktmasta_fastapi:latest
    docker build . -f angular.dockerfile --tag mktmasta_angular:latest
  args:
    creates: /opt/mktMasta/.build_complete

- name: Touch build marker
  file:
    path: /opt/mktMasta/.build_complete
    state: touch

- name: Start Docker Compose stack
  shell: |
    cd /opt/mktMasta
    docker compose up -d
  args:
    creates: /opt/mktMasta/.compose_started