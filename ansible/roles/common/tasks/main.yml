---
# Common tasks for all servers

- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - software-properties-common
      - python3-pip
      - uuid-runtime
      - jq
    state: present

- name: Configure firewall (allow SSH, HTTP, HTTPS)
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "22"
    - "80"
    - "443"

- name: Enable UFW
  ufw:
    state: enabled
    policy: deny

- name: Create data mount point
  file:
    path: /data
    state: directory
    mode: "0755"