<h2 mat-dialog-title>Select Fields</h2>
<mat-dialog-content>
  <div class="field-list">
    <mat-checkbox 
      *ngFor="let column of columns" 
      [checked]="isVisible(column.key)"
      (change)="toggle(column.key)">
      {{ column.label }}
    </mat-checkbox>
    
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button type="button" (click)="close()">Done</button>
</mat-dialog-actions>
